<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda Tech Funcional</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
  <section id="loginPage" class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <span class="material-symbols-outlined">dataset</span>
        <span>Tienda Tech</span>
      </div>

      <h1 class="login-title">Inicio de sesion</h1>
      <p class="login-text">Entra como usuario para comprar y guardar favoritos, o como empresa para administrar productos.</p>

      <div class="login-type-box">
        <button class="login-type-button active" type="button" data-role="usuario">Usuario</button>
        <button class="login-type-button" type="button" data-role="empresa">Empresa</button>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label id="emailLabel" class="form-label" for="emailInput">Correo del usuario</label>
          <input id="emailInput" class="form-input" type="email" placeholder="ejemplo@correo.com">
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordInput">Contrasena</label>
          <input id="passwordInput" class="form-input" type="password" placeholder="Ingresa tu contrasena">
        </div>

        <button id="loginSubmit" class="login-submit" type="submit">Entrar como usuario</button>
      </form>

      <p class="login-help">Cuentas de prueba: usuario@gmail.com / 1234 y empresa@gmail.com / 1234.</p>
    </div>
  </section>

  <main id="appPage" class="app-shell hidden">
    <header class="main-header">
      <div class="logo-box">
        <span class="material-symbols-outlined">dataset</span>
        <span>Tienda Tech</span>
      </div>

      <div class="session-info">
        <span id="sessionTypeText">Sesion: Usuario</span>
        <button id="logoutButton" class="logout-button" type="button">Salir</button>
      </div>
    </header>

    <div class="layout-body">
      <aside id="dashboard" class="dashboard"></aside>

      <section class="content-area">
        <div class="section-header">
          <h2 id="sectionTitle" class="section-title">Inicio</h2>
          <div id="sectionActions" class="section-actions"></div>
        </div>

        <div id="contentScroll" class="content-scroll">
          <div id="dynamicContent"></div>
        </div>
      </section>
    </div>
  </main>

  <script src="js/usuarios.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
